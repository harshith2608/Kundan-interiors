{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
  <h2 class="mt-3 fw-bold">500 – Something Went Wrong</h2>
  <p class="text-muted">An unexpected error occurred. Please try again or contact the administrator.</p>
  <a href="{{ url_for('projects.list_projects') }}" class="btn btn-primary ki-btn-primary">
    <i class="bi bi-house me-1"></i>Go Home
  </a>
</div>
{% endblock %}
